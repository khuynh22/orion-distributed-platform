version: '3.8'

services:
  # Databases
  postgres-order:
    image: postgres:15-alpine
    container_name: postgres-order
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-order-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-inventory:
    image: postgres:15-alpine
    container_name: postgres-inventory
    environment:
      POSTGRES_DB: inventorydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Microservices
  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    environment:
      DATABASE_URL: jdbc:postgresql://postgres-order:5432/orderdb
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      INVENTORY_SERVICE_HOST: inventory-service
      INVENTORY_SERVICE_PORT: 50052
      ANALYTICS_SERVICE_HOST: analytics-service
      ANALYTICS_SERVICE_PORT: 50053
    ports:
      - "8081:8081"
      - "50051:50051"
    depends_on:
      postgres-order:
        condition: service_healthy
      inventory-service:
        condition: service_started
      analytics-service:
        condition: service_started
    restart: unless-stopped

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: inventory-service
    environment:
      DATABASE_URL: jdbc:postgresql://postgres-inventory:5432/inventorydb
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
    ports:
      - "8082:8082"
      - "50052:50052"
    depends_on:
      postgres-inventory:
        condition: service_healthy
    restart: unless-stopped

  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    container_name: analytics-service
    environment:
      MONGODB_URI: mongodb://mongodb:27017/analytics
    ports:
      - "8083:8083"
      - "50053:50053"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  api-gateway-service:
    build:
      context: .
      dockerfile: api-gateway-service/Dockerfile
    container_name: api-gateway
    environment:
      ORDER_SERVICE_HOST: order-service
      ORDER_SERVICE_PORT: 50051
      INVENTORY_SERVICE_HOST: inventory-service
      INVENTORY_SERVICE_PORT: 50052
      ANALYTICS_SERVICE_HOST: analytics-service
      ANALYTICS_SERVICE_PORT: 50053
    ports:
      - "8080:8080"
    depends_on:
      - order-service
      - inventory-service
      - analytics-service
    restart: unless-stopped

volumes:
  postgres-order-data:
  postgres-inventory-data:
  mongodb-data:
