spring:
  application:
    name: order-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/orderdb}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081

grpc:
  server:
    port: 50051
  inventory:
    host: ${INVENTORY_SERVICE_HOST:localhost}
    port: ${INVENTORY_SERVICE_PORT:50052}
  analytics:
    host: ${ANALYTICS_SERVICE_HOST:localhost}
    port: ${ANALYTICS_SERVICE_PORT:50053}

logging:
  level:
    com.orion.platform: INFO
