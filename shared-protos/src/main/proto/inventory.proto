syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.orion.platform.grpc.inventory";
option java_outer_classname = "InventoryProto";

package inventory;

service InventoryService {
  rpc AdjustInventory(AdjustInventoryRequest) returns (AdjustInventoryResponse);
  rpc GetInventory(GetInventoryRequest) returns (GetInventoryResponse);
}

message AdjustInventoryRequest {
  string sku = 1;
  int32 quantity_change = 2;
  string reason = 3;
}

message AdjustInventoryResponse {
  string sku = 1;
  int32 current_quantity = 2;
  bool success = 3;
  string message = 4;
}

message GetInventoryRequest {
  string sku = 1;
}

message GetInventoryResponse {
  string sku = 1;
  int32 quantity = 2;
  int64 last_updated = 3;
}
