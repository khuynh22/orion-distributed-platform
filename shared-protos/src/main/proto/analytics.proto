syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.orion.platform.grpc.analytics";
option java_outer_classname = "AnalyticsProto";

package analytics;

service AnalyticsService {
  rpc RecordOrderEvent(RecordOrderEventRequest) returns (RecordOrderEventResponse);
  rpc GetOrderSummary(GetOrderSummaryRequest) returns (GetOrderSummaryResponse);
}

message RecordOrderEventRequest {
  string order_id = 1;
  string customer_id = 2;
  double total_amount = 3;
  int32 item_count = 4;
  int64 timestamp = 5;
}

message RecordOrderEventResponse {
  bool success = 1;
  string message = 2;
}

message GetOrderSummaryRequest {
  int64 start_date = 1;
  int64 end_date = 2;
}

message GetOrderSummaryResponse {
  int32 total_orders = 1;
  double total_revenue = 2;
  double average_order_value = 3;
  int32 total_items_sold = 4;
}
