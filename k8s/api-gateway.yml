apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: orion-platform
data:
  ORDER_SERVICE_HOST: "order-service"
  ORDER_SERVICE_PORT: "50051"
  INVENTORY_SERVICE_HOST: "inventory-service"
  INVENTORY_SERVICE_PORT: "50052"
  ANALYTICS_SERVICE_HOST: "analytics-service"
  ANALYTICS_SERVICE_PORT: "50053"

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: orion-platform
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: orion-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-gateway-config
