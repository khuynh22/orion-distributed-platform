name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build shared-protos
        run: mvn -f shared-protos/pom.xml clean install -DskipTests

      - name: Build order-service
        run: mvn -f order-service/pom.xml clean package -DskipTests

      - name: Build inventory-service
        run: mvn -f inventory-service/pom.xml clean package -DskipTests

      - name: Build analytics-service
        run: mvn -f analytics-service/pom.xml clean package -DskipTests

      - name: Build api-gateway-service
        run: mvn -f api-gateway-service/pom.xml clean package -DskipTests

      - name: Run tests
        run: mvn test
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/testdb
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          MONGODB_URI: mongodb://localhost:27017/test

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          docker build -f order-service/Dockerfile -t order-service:${{ github.sha }} .
          docker build -f inventory-service/Dockerfile -t inventory-service:${{ github.sha }} .
          docker build -f analytics-service/Dockerfile -t analytics-service:${{ github.sha }} .
          docker build -f api-gateway-service/Dockerfile -t api-gateway-service:${{ github.sha }} .

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: order-service/Dockerfile
          ignore: DL3008,DL3009

      - name: Lint Kubernetes YAML
        uses: instrumenta/kubeval-action@master
        with:
          files: k8s/
